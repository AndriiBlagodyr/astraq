name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node — lint, typecheck, unit tests
    runs-on: ubuntu-latest
    env:
      # Unit tests run in jsdom; e2e (and its browsers) aren't in CI yet.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      # Version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo's local cache: unchanged packages replay their last result.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Generated tokens match their source
        run: pnpm --filter @astraq/ui tokens:check

      # Regenerates openapi.json and the SDK types from the code; a diff means
      # someone changed an endpoint without running `pnpm contract`.
      - name: Contract matches the code
        run: |
          pnpm contract
          git diff --exit-code -- apps/api/openapi.json packages/sdk/src/schema.ts

      - run: pnpm turbo run lint typecheck test:unit

  api-integration:
    name: API — integration tests (TimescaleDB)
    runs-on: ubuntu-latest
    services:
      # Same image as infra/docker/compose.yml.
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: veracand
          POSTGRES_PASSWORD: veracand
          POSTGRES_DB: veracand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veracand -d veracand"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://veracand:veracand@localhost:5432/veracand
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@astraq/api^..." build

      # The same migrations a deploy applies, so the tests see the real schema.
      - run: pnpm --filter @astraq/api db:deploy

      - run: pnpm --filter @astraq/api test:integration

  ml:
    name: ML — ruff, mypy, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v5

      # Installs Python from services/ml/.python-version on first use.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/ml/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked

      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
