[project]
name = "veracand-ml"
version = "0.1.0"
description = "FastAPI ML prediction service for Veracand"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.26",
  "httpx>=0.28.0",
  "mypy>=2.4.0",
  "pytest>=8.3.0",
  "ruff>=0.16.10",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# So a test can import the helpers in tests/ (`from tests.fixtures import ...`).
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pyflakes + pycodestyle, plus import order, modern syntax, and common bugs.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
# `app` and `tests` have no __init__.py; resolve modules from this directory.
explicit_package_bases = true

# Service code is strict (AGENTS.md); tests are type-checked but may skip
# annotations on fixtures and helpers.
[[tool.mypy.overrides]]
module = ["app.*"]
strict = true

# The contract models (ADR 0012): `uv run datamodel-codegen`, or `pnpm
# contract:ml` at the root, rewrites app/contracts/ from the JSON Schema that
# `pnpm contract` emits from packages/shared. CI fails when it leaves a diff.
[tool.datamodel-codegen]
input = "../../packages/shared/json-schema/strategy.schema.json"
input-file-type = "jsonschema"
output = "app/contracts/strategy.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
class-name = "StrategyDefinition"
use-annotated = true
use-standard-collections = true
use-union-operator = true
enum-field-as-literal = "all"
disable-timestamp = true
formatters = ["ruff-check", "ruff-format"]

[tool.uv]
package = true
