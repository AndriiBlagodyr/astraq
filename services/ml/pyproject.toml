[project]
name = "forelume-ml"
version = "0.1.0"
description = "FastAPI ML prediction service for Forelume"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "uvicorn[standard]>=0.30.0"
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "mypy>=2.4.0",
  "pytest>=8.3.0",
  "ruff>=0.16.10",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pyflakes + pycodestyle, plus import order, modern syntax, and common bugs.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
# `app` and `tests` have no __init__.py; resolve modules from this directory.
explicit_package_bases = true

# Service code is strict (AGENTS.md); tests are type-checked but may skip
# annotations on fixtures and helpers.
[[tool.mypy.overrides]]
module = ["app.*"]
strict = true

[tool.uv]
package = true
